[project]
name = "tdd-based-api-service-stub"
version = "0.1.0"
description = "A mock Weather API service built with strict Test-Driven Development."
authors = [
    {name = "iToussaint",email = "iradukundatoussaint01@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry]
packages = [{include = "tdd_based_api_service_stub", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
